plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "me.modmuss50.mod-publish-plugin"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JEI/Jade: compiled against their APIs, and present in dev runs so the compat code can be tested; never bundled.
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric-api:${jei_version}"
    localRuntime("mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}") { exclude group: "net.fabricmc.fabric-api"; exclude group: "net.fabricmc" }
    compileOnly "maven.modrinth:jade:${jade_version}+fabric"
    localRuntime("maven.modrinth:jade:${jade_version}+fabric") { exclude group: "net.fabricmc.fabric-api"; exclude group: "net.fabricmc" }

    implementation include("com.coolerpromc.coolerconfig:coolerconfig-fabric-${minecraft_version}:${cooler_config_version}")

    // Dev-only MCTest harness: on the run classpath, never in the jar or POM.
    localRuntime("com.coolerpromc.mctest:mctest-fabric-${minecraft_version}:26.3.0.2") { transitive = false }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets.main.resources { srcDirs 'src/generated/resources', rootProject.project(':common').file('src/generated/resources/').getAbsolutePath() }

processResources {
    exclude 'data/ancientcreature/neoforge/**'
}

publishMods {
    file.set(jar.archiveFile)
    changelog = rootProject.file("changelog.md").text
    type = BETA
    modLoaders.add("fabric")
    displayName = mod_id + "-" + project.version + "+" + minecraft_version + "-fabric"

    curseforge {
        projectId = "1630188"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }

    modrinth {
        projectId = 'ygrX3nKx'
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}